databases:
  - name: habita-db
    plan: basic-256mb
    databaseName: habita
    user: habita

services:
  - type: web
    name: habita
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npx drizzle-kit push --force
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: habita-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
